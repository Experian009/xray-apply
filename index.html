<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Морской котик 🦭</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #7ec8e3 0%, #4aa3c7 40%, #1e6f9e 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .subtitle { opacity: .9; margin-bottom: 24px; }
  .seal-wrap {
    width: min(420px, 86vw);
    cursor: pointer;
  }
  #seal {
    width: 100%;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0, 30, 60, .45);
    transition: opacity .4s ease;
    animation: float 4.5s ease-in-out infinite;
    display: block;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-16px) rotate(1.2deg); }
  }
  #pose { font-size: 1.35rem; margin-top: 20px; min-height: 2rem; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .timer { margin-top: 10px; opacity: .85; }
  #countdown { font-variant-numeric: tabular-nums; font-weight: 700; }
  .hint { margin-top: 6px; font-size: .85rem; opacity: .65; }
  .bubble {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), rgba(255,255,255,.12));
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    to { transform: translateY(-110vh); }
  }
</style>
</head>
<body>
  <h1>🦭 Морской котик</h1>
  <p class="subtitle">Он живёт на этом сервере и меняет позу каждые 5 минут</p>
  <div class="seal-wrap" title="Нажми на котика">
    <img id="seal" src="seal1.png" alt="Морской котик">
  </div>
  <p id="pose">Котик машет ластой 👋</p>
  <p class="timer">Новая поза через <span id="countdown">5:00</span></p>
  <p class="hint">Нажми на котика — он сменит позу прямо сейчас</p>

<script>
  var poses = [
    { img: 'seal1.png', name: 'Котик машет ластой 👋' },
    { img: 'seal2.png', name: 'Котик держит мячик 🤹' },
    { img: 'seal3.png', name: 'Котик спит 💤' }
  ];
  var POSE_MS = 5 * 60 * 1000;
  var idx = 0;
  var nextChange = Date.now() + POSE_MS;
  var seal = document.getElementById('seal');
  var poseEl = document.getElementById('pose');
  var cdEl = document.getElementById('countdown');

  poses.forEach(function (p) { var i = new Image(); i.src = p.img; });

  function show(i) {
    idx = (i + poses.length) % poses.length;
    seal.style.opacity = 0;
    setTimeout(function () {
      seal.src = poses[idx].img;
      poseEl.textContent = poses[idx].name;
      if (seal.complete) seal.style.opacity = 1;
      else seal.onload = function () { seal.style.opacity = 1; };
    }, 400);
    nextChange = Date.now() + POSE_MS;
  }

  seal.addEventListener('click', function () { show(idx + 1); });

  setInterval(function () {
    var left = Math.max(0, nextChange - Date.now());
    var m = Math.floor(left / 60000);
    var s = Math.floor((left % 60000) / 1000);
    cdEl.textContent = m + ':' + (s < 10 ? '0' + s : s);
    if (left <= 0) show(idx + 1);
  }, 500);

  // пузырьки
  for (var b = 0; b < 14; b++) {
    var d = document.createElement('div');
    d.className = 'bubble';
    var size = 8 + Math.random() * 26;
    d.style.width = d.style.height = size + 'px';
    d.style.left = (Math.random() * 100) + 'vw';
    d.style.animationDuration = (7 + Math.random() * 9) + 's';
    d.style.animationDelay = (-Math.random() * 12) + 's';
    document.body.appendChild(d);
  }
</script>
</body>
</html>
